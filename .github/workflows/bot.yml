name: signal-bot

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run / test / chatid / backtest"
        required: true
        default: "run"
        type: choice
        options:
          - run
          - test
          - chatid
          - backtest

concurrency:
  group: signal-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Logic self-test
        run: python bot.py selftest

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: python bot.py "$MODE"

      - name: Save state
        if: always()
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "state"
            git pull --rebase || true
            git push
          fi
